<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>Łatka v0.5.5</title>
        <link rel="stylesheet" href="css/style.css?v=32" />
    </head>

    <body>
        <main id="game" aria-label="Łatka — gra">
            <header class="status" aria-label="Potrzeby i samopoczucie"></header>
            <section class="scene" aria-label="Pomieszczenie">
                <div class="roomTrack"></div>
                <canvas id="sceneCanvas" width="384" height="550"></canvas>
                <div class="roomBadge"><img alt="" /></div>
                <div class="heartBadge" aria-label="Samopoczucie Łatki"><img alt="Serce" /><div class="bar"><i></i></div></div>
                <div class="throwsBadge" hidden aria-hidden="true"><img alt="" /><img alt="" /><img alt="" /></div>
                <div class="fetchControls">
                    <button class="fetchEnd" hidden aria-label="Zakończ zabawę z piłką">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="white" stroke-width="3.4" stroke-linecap="round" /></svg>
                    </button>
                    <button class="fetchRestart" hidden aria-label="Zacznij rzuty od nowa">
                        <span class="fetchRestart__ring" aria-hidden="true"></span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="white" /></svg>
                    </button>
                </div>
                <button class="full" aria-label="Pełny ekran">⛶</button
                ><button class="arrow prev" aria-label="Poprzednie pomieszczenie">‹</button
                ><button class="arrow next" aria-label="Następne pomieszczenie">›</button
                ><button class="petAccess">Pogłaszcz Łatkę</button
                ><button class="poopAccess" hidden>Posprzątaj kupkę</button>
            </section>
            <footer class="dock">
                <nav class="menu" aria-label="Opieka i aktywności"></nav>
            </footer>
            <div class="popup" hidden>
                <div class="card"><canvas width="300" height="300"></canvas><img class="reward" alt="Nagroda" /></div>
            </div>
            <div class="ballPopup" hidden>
                <div class="ballCard">
                    <img class="ballIcon" alt="" />
                    <p>Przesuń palcem po ekranie w stronę, gdzie ma polecieć piłka. Łatka pobiegnie po nią!</p>
                    <button class="ballOk">OK, zaczynamy!</button>
                </div>
            </div>
            <div class="load">Wczytywanie Łatki…</div>
        </main>
        <div class="rotate"><span>📱 ↻</span>Obróć urządzenie do pionu.<small>Gra jest wstrzymana.</small></div>
        <div class="toast" hidden role="status"></div>

        <!-- TYMCZASOWY panel deweloperski — do usunięcia przed publikacją dla dziecka -->
        <button class="devToggle">🛠 DEV</button>
        <div class="devPanel" hidden>
            <div class="devRow" data-stat="food"><span>Jedzenie</span><output>50</output><button data-d="-20">−20</button><button data-d="20">+20</button></div>
            <div class="devRow" data-stat="water"><span>Woda</span><output>50</output><button data-d="-20">−20</button><button data-d="20">+20</button></div>
            <div class="devRow" data-stat="fun"><span>Zabawa</span><output>50</output><button data-d="-20">−20</button><button data-d="20">+20</button></div>
            <div class="devRow" data-stat="sleep"><span>Sen</span><output>50</output><button data-d="-20">−20</button><button data-d="20">+20</button></div>
            <div class="devRow" data-stat="clean"><span>Czystość</span><output>50</output><button data-d="-20">−20</button><button data-d="20">+20</button></div>
            <div class="devActions">
                <button class="devMaxAll">Wszystko 100%</button>
                <button class="devWake">Obudź</button>
                <button class="devClean">Usuń kupę</button>
            </div>
        </div>

        <script src="js/arc-carousel.js?v=32"></script>
        <script src="js/game.js?v=32"></script>
    </body>
</html>
