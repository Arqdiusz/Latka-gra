<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>Łatka v0.2.94</title>
        <link rel="stylesheet" href="css/style.css?v=2" />
    </head>

    <body>
        <main id="game" aria-label="Łatka — gra">
            <header class="status" aria-label="Potrzeby i samopoczucie"></header>
            <section class="scene" aria-label="Pomieszczenie">
                <div class="roomTrack"></div>
                <canvas id="sceneCanvas" width="384" height="550"></canvas>
                <div class="roomBadge"><img alt="" /></div>
                <button class="full" aria-label="Pełny ekran">⛶</button
                ><button class="arrow prev" aria-label="Poprzednie pomieszczenie">‹</button
                ><button class="arrow next" aria-label="Następne pomieszczenie">›</button
                ><button class="petAccess">Pogłaszcz Łatkę</button
                ><button class="poopAccess" hidden>Posprzątaj kupkę</button>
            </section>
            <footer class="dock">
                <nav class="menu" aria-label="Opieka i aktywności"></nav>
            </footer>
            <div class="popup" hidden>
                <div class="card"><canvas width="300" height="300"></canvas><img class="reward" alt="Nagroda" /></div>
            </div>
            <div class="load">Wczytywanie Łatki…</div>
        </main>
        <div class="rotate"><span>📱 ↻</span>Obróć urządzenie do pionu.<small>Gra jest wstrzymana.</small></div>
        <div class="toast" hidden role="status"></div>
        <script src="js/arc-carousel.js?v=2"></script>
        <script src="js/game.js?v=2"></script>
    </body>
</html>
