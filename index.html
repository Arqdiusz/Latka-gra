function geometry(){const f=currentFrame(),o={x:0,y:0,scale:100,...CFG[sheet].offsets[String(f)]};return {f,o,s:BASE*o.scale/100*(sheet==='a01'&&anim===1?1.04:1)*(sheet==='a01'&&anim===10?1.05:1)*0.70,w:cells[sheet][f-1].width,h:cells[sheet][f-1].height,g:CFG[sheet].ground};}
function drawDog(c,cx=x*W,gy=GROUND+jumpY,facing=left,ratio=1){const g=geometry();c.save();c.translate(cx,gy);if(facing)c.scale(-1,1);c.translate(g.o.x*BASE*ratio,g.o.y*BASE*ratio);c.scale(g.s*ratio,g.s*ratio);c.imageSmoothingEnabled=false;c.drawImage(cells[sheet][g.f-1],-g.w/2,-g.g);c.restore();}
function headPosition(){const g=geometry(),h=P.meta[sheet][g.f-1].head;return {x:x*W+(left?-1:1)*((h[0]-g.w/2)*g.s+g.o.x*BASE),y:GROUND+jumpY+(h[1]-g.g)*g.s+g.o.y*BASE};}
function petHit(px,py){if(!loaded)return false;const g=geometry();let xx=px-x*W;if(left)xx=-xx;const sx=(xx-g.o.x*BASE)/g.s+g.w/2,sy=(py-GROUND-jumpY-g.o.y*BASE)/g.s+g.g,b=P.meta[sheet][g.f-1].box,bw=b[2]-b[0],bh=b[3]-b[1];if(sx<b[0]+bw*.23||sx>=b[2]||sy<b[1]+bh*.1||sy>b[1]+bh*.86)return false;const ix=Math.floor(sx),iy=Math.floor(sy);if(ix<0||iy<0||ix>=g.w||iy>=g.h)return false;return pixels[sheet][g.f-1][(iy*g.w+ix)*4+3]>120;}
function poopRect(){const w=40,h=w*images.poop.height/images.poop.width;let offset=0;if(poop){const diff=order.indexOf(poop.room)-order.indexOf(room);offset=diff*W+roomOffset;}return {x:clamp((poop?.x||.3)*W,22,W-22)-w/2+offset,y:GROUND+24-h,w,h};}function poopHit(px,py){if(!dirty())return false;const r=poopRect();return px>r.x-6&&px<r.x+r.w+6&&py>r.y-6&&py<r.y+r.h+6;}
function cleanPoop(){if(!casual()||!dirty())return;interrupt();wake();poop=null;blockedActivity=null;updatePoopAccess();say('star');save();toast('Posprzątane — można znów wybrać czynność.');}
function spawnPoop(){if(!casual()||sleeping||poop)return false;interrupt();phase='toilet';locks();const facing=left;startQueue([{sheet:'a01',frames:[41,42,47],tempo:420,time:1260,onStart:()=>say('poop',2600),onEnd:()=>{poop={room,x:clamp(x+(left?1:-1)*.2,.08,.92)};updatePoopAccess();say('poop',4500);save();}},{sheet:'a01',frames:[48],tempo:350,time:350}]);nextPoop=clock+60000;return true;}
$('.poopAccess').onclick=cleanPoop;$('.petAccess').onclick=react;$('.arrow.prev').onclick=()=>stepRoom(-1);$('.arrow.next').onclick=()=>stepRoom(1);
function pointerXY(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*SH};}
function previewSwipe(dx){const dir=dx<0?1:-1,n=order.indexOf(room)+dir,valid=n>=0&&n<order.length;setOffset(valid?clamp(dx/scale,-W*.94,W*.94):clamp(dx/scale*.15,-36,36));}
function settleSwipe(dir,commit){const n=order.indexOf(room)+dir,valid=commit&&n>=0&&n<order.length,origin=roomOffset,end=valid?-dir*W:0,target=valid?order[n]:room;phase='travel';travelMode='swipe';stage=valid?'swipe-slide':'swipe-cancel';locks();const time=reduced?180:clamp(Math.abs(end-origin)/W*1000+180,260,1150);if(valid){wake();left=dir<0;bubble=null;}startQueue([{sheet:'a01',anim:valid?1:16,tempo:180,facing:valid?dir<0:left,time,onStart:()=>stage=valid?'swipe-slide':'swipe-cancel',update:p=>{const eased=1-Math.pow(1-p,3);setOffset(origin+(end-origin)*eased);},onEnd:()=>{if(valid)setRoom(target);else setOffset(0);}},{sheet:'a01',anim:16,time:200,onEnd:()=>finishTravel(null)}]);}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(gesture){if(gesture.kind==='pet')stopPetting();if(phase==='swipe-preview')settleSwipe(1,false);gesture=null;return;}const p=pointerXY(e);gesture={id:e.pointerId,sx:e.clientX,sy:e.clientY,kind:null,dog:petHit(p.x,p.y),poop:poopHit(p.x,p.y)};try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.sx,dy=e.clientY-g.sy;if(!g.kind){if(Math.abs(dy)>18&&Math.abs(dy)>Math.abs(dx)*1.2){g.kind=g.dog&&!g.poop&&canPet()?'pet':'vertical';if(g.kind==='pet')startPetting();}else if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.2&&casual()){g.kind='swipe';interrupt();wake();phase='swipe-preview';locks();}}if(g.kind==='swipe')previewSwipe(dx);if(g.kind==='pet'){e.preventDefault();petLast=clock;petFinishAt=Infinity;if(!bubble||bubble.until<clock+1000)say('heart',2500);}});
function pointerEnd(e,cancel=false){const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;try{if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_){}if(g.kind==='pet'){stopPetting();return;}const dx=e.clientX-g.sx,dy=e.clientY-g.sy;if(g.kind==='swipe'){settleSwipe(dx<0?1:-1,!cancel&&Math.abs(dx)>=45&&Math.abs(dx)>Math.abs(dy)*1.2);return;}if(cancel)return;if(!g.kind&&Math.hypot(dx,dy)<=12){const p=pointerXY(e);if(g.poop&&poopHit(p.x,p.y))cleanPoop();else if(g.dog&&petHit(p.x,p.y))react();}}
canvas.addEventListener('pointerup',e=>pointerEnd(e));canvas.addEventListener('pointercancel',e=>pointerEnd(e,true));canvas.addEventListener('lostpointercapture',e=>{if(gesture?.id===e.pointerId)pointerEnd(e,true);});
function chooseDestination(){const a=order.filter(r=>r!==room),weights=a.map(r=>r==='garden'?5:r==='yard'?2:1);let n=Math.random()*weights.reduce((s,v)=>s+v,0);for(let i=0;i<a.length;i++){n-=weights[i];if(n<=0)return a[i];}return a[0];}function autoTrip(target=chooseDestination()){if(!casual()||sleeping||gesture||menu.drag)return false;trips++;route(target,null,'auto');return true;}
function localWalk(){if(!casual())return;interrupt();phase='roam';const dest=x<=.5?.58:.42,dist=Math.abs(dest-x)*W;if(dist<2){idle();return;}locks();startQueue([{sheet:'a01',anim:6,motion:'walk',to:dest,time:dist/60*1000}]);}function autonomous(){const r=Math.random();if(r<.55)localWalk();else if(r<.72){phase='pause';locks();startQueue([{sheet,frames:[currentFrame()],tempo:1000,time:1000+Math.random()*900}]);}else if(r<.86){phase='look';locks();startQueue([repeatPart('a01',Math.random()<.5?3:7)]);}else idle();}
function butterflyEvent(){if(!casual()||sleeping||dirty()||!['garden','yard'].includes(room)||menu.drag||gesture)return false;interrupt();phase='butterfly';bubble=null;locks();const dir=x<.5?1:-1;left=dir<0;const flightStart={x:dir>0?-25:W+25,y:200},flightEnd={x:x*W+dir*82,y:GROUND-240};butterfly={visible:true,x:flightStart.x,y:flightStart.y,dir};startQueue([{sheet:'a01',anim:16,time:2200,onStart:()=>stage='butterfly-flight',update:p=>{butterfly.x=flightStart.x+(flightEnd.x-flightStart.x)*p;butterfly.y=flightStart.y+(flightEnd.y-flightStart.y)*p+Math.sin(p*Math.PI*4)*13;}},{sheet:'a01',anim:3,time:900,onStart:()=>stage='butterfly-watch',update:p=>{butterfly.x=flightEnd.x+Math.sin(p*5)*7;butterfly.y=flightEnd.y+Math.cos(p*6)*9;}},{sheet:'a02',anim:14,facing:dir<0,to:clamp(x+dir*.1,.35,.65),time:duration('a02',14)*2,onStart:()=>{stage='butterfly-chase';butterfly.visible=false;}},{sheet:'a02',anim:17,facing:dir<0,time:duration('a02',17),onStart:()=>stage='butterfly-nose'},{sheet:'a01',anim:16,facing:dir<0,time:1000,onStart:()=>{stage='butterfly-leave';butterfly.visible=true;butterfly.from={x:x*W+dir*82,y:GROUND-240};},update:p=>{butterfly.x=butterfly.from.x+dir*190*p;butterfly.y=butterfly.from.y-90*p+Math.sin(p*8)*6;},onEnd:()=>{nextButterfly=clock+45000+Math.random()*40000;butterfly=null;}}]);return true;}
function iconDraw(c,key,x,y,w,h=w){if(key==='poop'){const ratio=images.poop.width/images.poop.height;let iw=w,ih=w/ratio;if(ih>h){ih=h;iw=h*ratio;}c.drawImage(images.poop,x+(w-iw)/2,y+(h-ih)/2,iw,ih);return;}const n=UI.map[key];if(n&&cells.ui[n-1])c.drawImage(cells.ui[n-1],x,y,w,h);}
function bubbleDraw(dt){if(!bubble||clock>bubble.until){bubblePos=null;return;}const h=headPosition(),size=clamp(UI.bubbleSize,60,106),target={x:clamp(h.x-size*(left?.36:.64),6,W-size-6),y:clamp(h.y-size-12,6,SH-size-6)};if(!bubblePos)bubblePos={...target};const blend=1-Math.exp(-dt/110);bubblePos.x+=(target.x-bubblePos.x)*blend;bubblePos.y+=(target.y-bubblePos.y)*blend;const bx=clamp(bubblePos.x,6,W-size-6),by=clamp(bubblePos.y,6,SH-size-6),type=bubble.type||'thought';ctx.save();if(left){ctx.translate(bx+size,by);ctx.scale(-1,1);iconDraw(ctx,type,0,0,size);}else iconDraw(ctx,type,bx,by,size);ctx.restore();const center=P.bubbleCenters[type]||[.5,.4],symbol=Math.min(UI.bubbleSymbolSize,size*.58);iconDraw(ctx,bubble.icon,bx+(left?1-center[0]:center[0])*size-symbol/2,by+center[1]*size-symbol/2-1,symbol);}
function draw(dt){ctx.clearRect(0,0,W,SH);ctx.imageSmoothingEnabled=false;drawDog(ctx);if(boneVisible)iconDraw(ctx,'bone',x*W+20,GROUND-30,37);if(butterfly?.visible){ctx.save();ctx.translate(butterfly.x,butterfly.y);if(butterfly.dir<0)ctx.scale(-1,1);ctx.drawImage(images['b'+Math.floor(clock/130)%2],-22,-22,44,44);ctx.restore();}
// Dropping is explicitly a foreground layer and below the dog's walking baseline.
if(poop&&Math.abs(order.indexOf(poop.room)-order.indexOf(room))<=1){const r=poopRect();ctx.drawImage(images.poop,r.x,r.y,r.w,r.h);}bubbleDraw(dt);if(!$('.popup').hidden){rewardCtx.clearRect(0,0,300,300);drawDog(rewardCtx,150,255,left,.72);}const c=x*W;$('.arrow.prev').classList.toggle('near',c-102<66);$('.arrow.next').classList.toggle('near',c+102>W-66);}
function loopFrame(t){const dt=last?Math.min(60,t-last):0;last=t;if(loaded&&!document.hidden&&!orientationPaused){clock+=dt;if(phase!=='swipe-preview')frameIndex=Math.floor((clock-animStart)/ms)%frames.length;if(segment){const p=clamp((clock-segment.started)/segment.time,0,1);if(segment.to!==undefined)x=segment.origin+(segment.to-segment.origin)*p;if(segment.motion){const travelled=Math.abs(x-segment.origin)*W,stride=segment.motion==='walk'?13:36;frameIndex=segment.distance>2?Math.floor(travelled/stride)%frames.length:0;}segment.update?.(p);if(p>=1){const old=segment;segment=null;old.onEnd?.();if(!segment&&phase!=='idle')nextSegment();}}else if(phase==='petting'){if(clock>=petFinishAt||(!gesture&&clock-petLast>3000))endPetting();}else if(phase==='idle'&&!sleeping&&!gesture&&!menu.drag){if(clock>=nextPoop&&!poop)spawnPoop();else if(clock>=nextTrip)autoTrip();else if(clock>=nextButterfly&&!dirty()&&['garden','yard'].includes(room))butterflyEvent();else if(clock>=idleUntil)autonomous();}if(clock>=nextBubble&&!sleeping&&phase==='idle'){say(dirty()?'poop':['food','water','fun','sleep','clean'][Math.floor(Math.random()*5)]);nextBubble=clock+14000;}draw(dt);}requestAnimationFrame(loopFrame);}
async function loadImage(src){const im=new Image();await new Promise((ok,bad)=>{im.onload=ok;im.onerror=()=>bad(Error('Nie można odczytać grafiki.'));im.src=src;});return im;}
async function boot(){for(const k of ['a01','a02','ui','poop'])images[k]=await loadImage(P.assets[k]);for(let i=0;i<2;i++)images['b'+i]=await loadImage(P.assets.butterflies[i]);for(const key of ['a01','a02','ui']){const rows=key==='ui'?6:12,im=images[key],w=im.width/6,h=im.height/rows;for(let f=0;f<rows*6;f++){const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.drawImage(im,(f%6)*w,Math.floor(f/6)*h,w,h,0,0,w,h);cells[key].push(c);if(key!=='ui')pixels[key].push(cx.getImageData(0,0,w,h).data);}}for(const [key,n] of Object.entries(UI.map))icons[key]=cells.ui[n-1].toDataURL('image/png');statusBuild();const root=$('.menu');for(const name of ['pointerdown','keydown','click'])root.addEventListener(name,e=>{if(!casual()){e.preventDefault();e.stopImmediatePropagation();return;}if(name!=='click'){interrupt();wake();}},true);menu=new ArcCarousel(root,{items:items.map(i=>({...i,svg:'<img alt="" src="'+icons[i.icon]+'">'})),selectedId:selected});root.addEventListener('arc:change',e=>selected=e.detail.id);root.addEventListener('arc:activate',e=>action(e.detail.id));loaded=true;setRoom(room);setAnim(sleeping?'a02':'a01',sleeping?6:16);if(dirty())say('poop',4000);$('.load').hidden=true;locks();resize();save();requestAnimationFrame(loopFrame);}
$('.full').onclick=async()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else document.webkitExitFullscreen?.();return;}const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)await el.webkitRequestFullscreen();else return toast('Pełny ekran jest niedostępny w tej przeglądarce.');try{if(screen.orientation?.lock)await screen.orientation.lock('portrait');else throw Error();}catch(e){toast('Brak automatycznej blokady obrotu — trzymaj urządzenie pionowo.');}}catch(e){toast('Przeglądarka nie pozwoliła uruchomić pełnego ekranu.');}};
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){save();if(gesture?.kind==='pet')stopPetting();if(phase==='swipe-preview'){phase='idle';setOffset(0);locks();}gesture=null;}});window.addEventListener('error',e=>{$('.load').hidden=false;$('.load').textContent='Błąd wersji testowej: '+e.message;});boot().catch(e=>{$('.load').hidden=false;$('.load').textContent=e.message;});
window.gameTest={state:()=>({loaded,room,x,left,phase,stage,travelMode,sheet,anim,frame:currentFrame(),actions,trips,sleeping,selected,stats,heart:heart(),poop,dirty:!!dirty(),blockedActivity,scale,orientationPaused,butterfly,butterflyVisible:!!butterfly?.visible,bubble,bubblePos,route:debugRoute,roomOffset,segmentTime:segment?.time,segmentMotion:segment?.motion||null,gesture:gesture?.kind||null,sceneH:SH,ground:GROUND,dogBase:BASE}),step:stepRoom,action,touch:react,poop:spawnPoop,butterfly:butterflyEvent,walk:localWalk,hit:petHit,head:headPosition,poopRect,clean:cleanPoop,advance:n=>clock+=n,forceVariant:v=>forcedVariant=v,select:(id,animate=false)=>menu.select(id,{animate}),at:(r,pos=.5)=>{gesture=null;queue=[];segment=null;butterfly=null;$('.popup').hidden=true;sleeping=false;x=pos;phase='idle';setRoom(r);idle(16);nextPoop=clock+45000;nextTrip=clock+32000;nextButterfly=clock+28000;},needs:s=>{Object.assign(stats,s);statusUpdate();syncMenu();},petStart:startPetting,petEnd:stopPetting,menu:()=>menu,putPoop:(r,pos=.3)=>{poop={room:r,x:pos};updatePoopAccess();save();},clearPoop:()=>{poop=null;updatePoopAccess();save();}};
</script></body></html>
