name: "Łatka — ustawienia menu dolnego"

on:
  workflow_dispatch:
    inputs:
      menu_height:
        description: "Wysokość obszaru .menu w px (Twoje działające: 20)"
        required: true
        default: "20"
        type: string

      menu_shift_y:
        description: "Przesunięcie ikon w pionie w px (Twoje działające: -240.2)"
        required: true
        default: "-240.2"
        type: string

      panel_height:
        description: "Wysokość tła pod ikonami w px"
        required: true
        default: "300"
        type: string

      panel_color:
        description: "Kolor tła pod ikonami, np. #efe1d7"
        required: true
        default: "#efe1d7"
        type: string

      icon_size:
        description: "Rozmiar ikony w px (obecnie 80)"
        required: true
        default: "80"
        type: string

      dock_height:
        description: "Wysokość stopki w px (obecnie 400)"
        required: true
        default: "400"
        type: string

      dock_color:
        description: "Kolor tła stopki, np. #efe1d7"
        required: true
        default: "#efe1d7"
        type: string

      border_width:
        description: "Grubość górnej linii stopki w px"
        required: true
        default: "2"
        type: string

      border_color:
        description: "Kolor górnej linii stopki, np. #fff8"
        required: true
        default: "#fff8"
        type: string

      icon_padding:
        description: "Wewnętrzny odstęp wokół ikony w px"
        required: true
        default: "5"
        type: string

      icon_border_width:
        description: "Grubość obwódki ikony w px"
        required: true
        default: "3"
        type: string

      icon_border_color:
        description: "Kolor obwódki ikony, np. white"
        required: true
        default: "white"
        type: string

      icon_color:
        description: "Opcjonalnie: jeden kolor tła wszystkich ikon; puste = obecne kolory"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-menu-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pobierz aktualną grę
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Zastosuj ustawienia menu
        env:
          MENU_HEIGHT: ${{ inputs.menu_height }}
          MENU_SHIFT_Y: ${{ inputs.menu_shift_y }}
          PANEL_HEIGHT: ${{ inputs.panel_height }}
          PANEL_COLOR: ${{ inputs.panel_color }}
          ICON_SIZE: ${{ inputs.icon_size }}
          DOCK_HEIGHT: ${{ inputs.dock_height }}
          DOCK_COLOR: ${{ inputs.dock_color }}
          BORDER_WIDTH: ${{ inputs.border_width }}
          BORDER_COLOR: ${{ inputs.border_color }}
          ICON_PADDING: ${{ inputs.icon_padding }}
          ICON_BORDER_WIDTH: ${{ inputs.icon_border_width }}
          ICON_BORDER_COLOR: ${{ inputs.icon_border_color }}
          ICON_COLOR: ${{ inputs.icon_color }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          def number(name, minimum, maximum, allow_decimal=True):
              raw = os.environ[name].strip().replace(",", ".")
              try:
                  value = float(raw)
              except ValueError:
                  raise SystemExit(f"{name}: wpisz liczbę, np. 300.")
              if not minimum <= value <= maximum:
                  raise SystemExit(
                      f"{name}: dozwolony zakres to {minimum}–{maximum}."
                  )
              if value == int(value):
                  return str(int(value))
              if not allow_decimal:
                  raise SystemExit(f"{name}: wpisz liczbę całkowitą.")
              return f"{value:g}"

          def color(name, fallback=None):
              raw = os.environ[name].strip()
              if not raw:
                  if fallback is None:
                      return None
                  return fallback
              if not re.fullmatch(
                  r"#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})|white|black",
                  raw
              ):
                  raise SystemExit(
                      f"{name}: użyj formatu #RRGGBB, np. #efe1d7, albo white."
                  )
              return raw

          menu_height = number("MENU_HEIGHT", 10, 120)
          menu_shift_y = number("MENU_SHIFT_Y", -400, 0)
          panel_height = number("PANEL_HEIGHT", 100, 400)
          panel_color = color("PANEL_COLOR")
          icon_size = number("ICON_SIZE", 30, 120)
          dock_height = number("DOCK_HEIGHT", 100, 400)
          dock_color = color("DOCK_COLOR")
          border_width = number("BORDER_WIDTH", 0, 10, allow_decimal=False)
          border_color = color("BORDER_COLOR")
          icon_padding = number("ICON_PADDING", 0, 24, allow_decimal=False)
          icon_border_width = number(
              "ICON_BORDER_WIDTH", 0, 10, allow_decimal=False
          )
          icon_border_color = color("ICON_BORDER_COLOR")
          icon_color = color("ICON_COLOR")

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          px = r"\d+(?:\.\d+)?px"
          hexcolor = r"#[0-9a-fA-F]{3,8}"

          # 1. Wysokość stopki w siatce strony.
          source, count = re.subn(
              rf"(grid-template-rows:\s*106px\s+550px\s+){px}(\s*;)",
              rf"\g<1>{dock_height}px\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano wysokości stopki.")

          # 2. Wysokość i przesunięcie obszaru .menu.
          source, count = re.subn(
              rf"(\.menu\{{[^}}]*?height\s*:\s*){px}(\s*;)",
              rf"\g<1>{menu_height}px\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano wysokości menu.")

          source, count = re.subn(
              rf"(\.menu\{{[^}}]*?transform\s*:\s*translateY\(\s*)-?{px}(\s*\))",
              rf"\g<1>{menu_shift_y}px\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano przesunięcia menu.")

          # 3. Tło pod ikonami: zmiana istniejących zmiennych.
          source, count = re.subn(
              r"(--panel-height\s*:\s*)[^;]+(;)",
              rf"\g<1>{panel_height}px\g<2>",
              source,
              count=1
          )

          if count == 0:
              # Pierwsze uruchomienie: dodaj zmienne do reguły .menu.
              source, count = re.subn(
                  r"(\.menu\{)",
                  rf"\g<1>--panel-height:{panel_height}px;--panel-color:{panel_color};",
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Nie rozpoznano reguły .menu.")

          source, count = re.subn(
              r"(--panel-color\s*:\s*)[^;]+(;)",
              rf"\g<1>{panel_color}\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano koloru tła pod ikonami.")

          # 4. Dodaj regułę tła, jeśli jeszcze nie istnieje.
          if ".menu::before" not in source:
              panel_css = (
                  "\n\n      .menu::before{"
                  "content:\"\";"
                  "position:absolute;"
                  "left:0;"
                  "right:0;"
                  "top:50%;"
                  "height:var(--panel-height,300px);"
                  "transform:translateY(-50%);"
                  "background:var(--panel-color,#efe1d7);"
                  "z-index:-1;"
                  "}"
              )

              match = re.search(r"\.menu\{[^}]*\}", source)
              if not match:
                  raise SystemExit("Nie rozpoznano reguły .menu.")

              source = (
                  source[:match.end()]
                  + panel_css
                  + source[match.end():]
              )

          # 5. Kolor i linia stopki.
          source, count = re.subn(
              rf"(\.dock\{{[^}}]*?background\s*:\s*){hexcolor}(\s*;)",
              rf"\g<1>{dock_color}\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano tła stopki.")

          source, count = re.subn(
              rf"(\.dock\{{[^}}]*?border-top\s*:\s*){px}\s+solid\s+{hexcolor}(\s*;)",
              rf"\g<1>{border_width}px solid {border_color}\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano górnej linii stopki.")

          # 6. Ikony.
          source, count = re.subn(
              rf"(\.arc-menu__icon\{{[^}}]*?width\s*:\s*){px}(\s*;)",
              rf"\g<1>{icon_size}px\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano szerokości ikony.")

          source, count = re.subn(
              rf"(\.arc-menu__icon\{{[^}}]*?height\s*:\s*){px}(\s*;)",
              rf"\g<1>{icon_size}px\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano wysokości ikony.")

          source, count = re.subn(
              rf"(\.arc-menu__button\s*\{{[^}}]*?padding\s*:\s*){px}(\s*;)",
              rf"\g<1>{icon_padding}px\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano odstępu ikony.")

          source, count = re.subn(
              rf"(\.arc-menu__button\s*\{{[^}}]*?border\s*:\s*){px}\s+solid\s+[^\s;]+(\s*;)",
              rf"\g<1>{icon_border_width}px solid {icon_border_color}\g<2>",
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Nie rozpoznano obwódki ikony.")

          if icon_color:
              source, count = re.subn(
                  r"(\.arc-menu__button\s*\{[^}]*?background\s*:\s*)var\(--item-color\)(\s*;)",
                  rf"\g<1>{icon_color}\g<2>",
                  source,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Nie rozpoznano koloru tła ikon.")

          path.write_text(source, encoding="utf-8")

          summary = [
              "## Nowe ustawienia menu dolnego",
              f"- Wysokość .menu: {menu_height} px.",
              f"- Przesunięcie ikon: {menu_shift_y} px.",
              f"- Tło pod ikonami: {panel_height} px, {panel_color}.",
              f"- Rozmiar ikony: {icon_size} px.",
              f"- Stopka: {dock_height} px, tło {dock_color}.",
              f"- Górna linia: {border_width} px, {border_color}.",
              f"- Wewnętrzny odstęp ikony: {icon_padding} px.",
              f"- Obwódka ikony: {icon_border_width} px, {icon_border_color}."
          ]

          if icon_color:
              summary.append(f"- Wspólny kolor ikon: {icon_color}.")
          else:
              summary.append("- Kolory poszczególnych ikon: bez zmian.")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as report:
              report.write("\n".join(summary) + "\n")

      - name: Zapisz zmianę w repozytorium
        run: |
          if git diff --quiet -- index.html; then
            echo "Ustawienia są już takie same."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update Latka bottom menu settings"
            git push origin HEAD:main
          fi

      - name: Przygotuj pliki strony
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          for directory in animacje ikony inne tla ustawienia animacje-ustawienia; do
            if [ -d "$directory" ]; then
              cp -R "$directory" "_site/$directory"
            fi
          done

      - name: Przygotuj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przekaż stronę do publikacji
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Opublikuj grę
        id: deployment
        uses: actions/deploy-pages@v4
